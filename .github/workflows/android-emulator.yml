# 안드로이드 에뮬레이터 시험 — Linux 러너(KVM)에서 시험용 APK 를 설치해 눌러 본다(P4 FR-471). 서명은 실행 때 만든 시험 키로만(CLAUDE.md 7절).
# 빌드·에뮬레이터는 scripts/dev_tools.env 의 ANDROID_IMAGE 안에서. 과정은 저장소 안 자료(tests/fixtures/) — Actions 는 MWL·Learn 을 읽지 못한다.
# KVM: GitHub changelog 2024-04-02 의 udev 규칙. 검사: python3 scripts/check_workflows.py. 문서: docs/P4_설계서_Mobile.md 3.9절
name: android-emulator
on:
  push:
    branches: [main, "impl-phase*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: KVM 켜기
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: 빌드 이미지 받기
        run: |
          . scripts/dev_tools.env
          docker pull "$ANDROID_IMAGE" > /dev/null
      - name: 시험용 APK(시험 키·디버그)
        run: bash scripts/build_android.sh --courses tests/fixtures/mwl/scheduler_course.json --test-key --debuggable
      - name: 에뮬레이터 시험
        run: python3 mobile/android/e2e/emulator_test.py "dist/android/MyLearningPlatform-v$(python3 mobile/android/tools/pack.py version | cut -d' ' -f1)-test.apk" shots --fetch
      - name: 캡처(시험 증거)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulator-shots
          path: shots/
          retention-days: 7
          if-no-files-found: ignore
